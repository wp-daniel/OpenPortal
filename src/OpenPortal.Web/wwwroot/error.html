<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Something went wrong - OpenPortal</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #fafafa;
        --surface: #ffffff;
        --border: #e4e4e7;
        --text: #18181b;
        --muted: #71717a;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #09090b;
          --surface: #18181b;
          --border: #27272a;
          --text: #fafafa;
          --muted: #a1a1aa;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--background);
        color: var(--text);
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.6;
      }

      main {
        max-width: 34rem;
        width: 100%;
        padding: 2rem;
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        background: var(--surface);
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.375rem;
        letter-spacing: -0.01em;
      }

      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
      }

      a {
        display: inline-block;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        background: var(--text);
        color: var(--background);
        text-decoration: none;
        font-weight: 500;
      }

      a:hover {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Something went wrong</h1>
      <p>
        The server could not complete that request. If this keeps happening, check the application logs for
        the trace identifier of the failed request.
      </p>
      <a href="/">Back to the portal</a>
    </main>
  </body>
</html>

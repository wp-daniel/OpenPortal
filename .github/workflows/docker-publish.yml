name: Publish image

# Publishes the image to GitHub Container Registry as ghcr.io/<owner>/openportal.
#
# Manual only for now (Actions tab, "Run workflow", choosing a version tag such as v1.2.3): no push or tag
# builds or publishes an image. To publish on every version tag again, add under "on:"
#   push:
#     tags: ['v*.*.*']
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: release
        if: github.ref_type == 'tag'
        env:
          OPENPORTAL_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$OPENPORTAL_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Select a version tag such as v0.1.0." >&2
            exit 1
          fi
          echo "version=${OPENPORTAL_TAG#v}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/openportal
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPENPORTAL_VERSION=${{ steps.release.outputs.version }}
            OPENPORTAL_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
